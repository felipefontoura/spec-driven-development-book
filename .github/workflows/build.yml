name: Build book (PDF + EPUB)

# Every run builds both editions, so a broken book is caught on any branch or PR
# and nothing leaves CI by default (no Actions artifacts, no release assets: the
# book is sold, and the .md repo stays public).
# Publishing is deliberate: ONLY a run on the `stable` branch uploads the
# finished PDF + EPUB + cover to the PRIVATE S3-compatible bucket (Cloudflare R2)
# that the site's /dl serves. PRs, main, tags and manual runs from any other
# branch only validate. To release: merge into `stable`.
# Upload is also skipped when the BOOK_S3_* secrets are not set.
# Build locally anytime: `bash kit/scripts/build.sh --all`.

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: pt-br
            source: BOOK.pt-BR.md
          - lang: en
            source: BOOK.en.md

    steps:
      - name: Checkout (with the public book-kit engine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Skip if source missing
        id: probe
        run: |
          if [[ -f "${{ matrix.source }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source ${{ matrix.source }} not present — skipping ${{ matrix.lang }}."
          fi

      # Installs Node + Typst pinned by mise.toml — same toolchain as local dev.
      - name: Setup toolchain (mise → Node + Typst)
        if: steps.probe.outputs.present == 'true'
        uses: jdx/mise-action@v5

      # npm ci in the engine submodule; puppeteer downloads Chromium for Mermaid.
      - name: Install engine dependencies
        if: steps.probe.outputs.present == 'true'
        working-directory: kit
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: "false"

      - name: Build PDF + EPUB + cover (validation only — not published)
        if: steps.probe.outputs.present == 'true'
        env:
          SOURCE_MD: ${{ matrix.source }}
        run: bash kit/scripts/build.sh --all

      - name: Confirm the three outputs exist
        if: steps.probe.outputs.present == 'true'
        run: |
          test -f "dist/book-${{ matrix.lang }}.pdf"
          test -f "dist/book-${{ matrix.lang }}.epub"
          test -f "dist/cover-${{ matrix.lang }}.png"
          echo "OK ${{ matrix.lang }}: PDF + EPUB + cover built (kept private, not uploaded)"

      # Private bucket upload: only on the `stable` branch (a push to it, or a
      # manual run started from it). Layout: <prefix>/stable-<sha>/<file>
      # (immutable copy of each release) and <prefix>/latest/<file> (what the
      # site's /dl serves, overwritten on every release).
      # Secrets: BOOK_S3_ENDPOINT (B2: https://s3.<region>.backblazeb2.com;
      # leave empty for AWS; R2: https://<account>.r2.cloudflarestorage.com,
      # region "auto"), BOOK_S3_REGION, BOOK_S3_BUCKET,
      # BOOK_S3_ACCESS_KEY_ID, BOOK_S3_SECRET_ACCESS_KEY.
      - name: Upload to private bucket
        if: >-
          steps.probe.outputs.present == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/stable'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BOOK_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BOOK_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BOOK_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BUCKET: ${{ secrets.BOOK_S3_BUCKET }}
          ENDPOINT: ${{ secrets.BOOK_S3_ENDPOINT }}
          PREFIX: sdd-book
          LANG_ID: ${{ matrix.lang }}
        run: |
          if [[ -z "$BUCKET" || -z "$AWS_ACCESS_KEY_ID" ]]; then
            echo "::notice::BOOK_S3_* secrets not set — skipping private upload."
            exit 0
          fi
          # Second lock, in case the `if` above is ever loosened by mistake.
          if [[ "$GITHUB_REF" != "refs/heads/stable" ]]; then
            echo "::error::Refusing to publish from $GITHUB_REF: only stable publishes."
            exit 1
          fi
          ref="stable-${GITHUB_SHA::7}"
          args=()
          [[ -n "$ENDPOINT" ]] && args+=(--endpoint-url "$ENDPOINT")
          for f in "book-$LANG_ID.pdf" "book-$LANG_ID.epub" "cover-$LANG_ID.png"; do
            aws s3 cp "dist/$f" "s3://$BUCKET/$PREFIX/$ref/$f" "${args[@]}" --only-show-errors
            aws s3 cp "dist/$f" "s3://$BUCKET/$PREFIX/latest/$f" "${args[@]}" --only-show-errors
          done
          echo "Published $LANG_ID to the private bucket: $PREFIX/$ref/ and $PREFIX/latest/"
